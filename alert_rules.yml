groups:
  - name: rocketmq-exporter
    rules:
      - alert: RocketMQConsumerGroupLagWarning
        expr: rocketmq_group_lag_total > 10000 AND ON(group) rocketmq_group_count > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.group }} has high lag"
          description: "Consumer group {{ $labels.group }} on topic {{ $labels.topic }} has {{ $value }} messages lagging"

      - alert: RocketMQConsumerGroupLagCritical
        expr: rocketmq_group_lag_total > 50000 AND ON(group) rocketmq_group_count > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Consumer group {{ $labels.group }} has critical lag"
          description: "Consumer group {{ $labels.group }} on topic {{ $labels.topic }} has {{ $value }} messages lagging"

      - alert: RocketMQConsumerGroupLagDynamic
        expr: |
          rocketmq_group_lag_total > (10000 + ON(group) rocketmq_group_count * 5000)
          AND ON(group) rocketmq_group_count > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.group }} dynamic lag alert"
          description: "Consumer group {{ $labels.group }} on topic {{ $labels.topic }} has {{ $value }} messages lagging (threshold: 10000 + 5000 * consumer_count)"

      - alert: RocketMQConsumerOffline
        expr: rocketmq_group_count == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.group }} has no online consumers"
          description: "Consumer group {{ $labels.group }} has 0 online consumers"

      - alert: RocketMQBrokerDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RocketMQ exporter is down"
          description: "RocketMQ exporter instance is not responding"

      - alert: RocketMQProducerCountDrop
        expr: delta(rocketmq_producer_count[5m]) < -1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Producer count dropped for group {{ $labels.group }}"
          description: "Producer count decreased by more than 1 in the last 5 minutes"

      - alert: RocketMQConsumerClientFailRateHigh
        expr: rocketmq_client_consume_fail_msg_tps / (rocketmq_client_consume_ok_msg_tps + rocketmq_client_consume_fail_msg_tps) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High consumer failure rate for {{ $labels.group }}"
          description: "Consumer client failure rate is {{ $value | humanize }} for group {{ $labels.group }}"

      - alert: RocketMQConsumerConsumeRTTooHigh
        expr: rocketmq_client_consume_rt > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High consume RT for {{ $labels.group }}"
          description: "Consumer RT is {{ $value }}ms for group {{ $labels.group }}"

      - alert: RocketMQBrokerTPSDrop
        expr: delta(rocketmq_broker_tps[5m]) < -100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Broker TPS dropped for {{ $labels.broker }}"
          description: "Broker TPS decreased by more than 100 in the last 5 minutes"

      - alert: RocketMQTopicPutTPSHigh
        expr: rocketmq_topic_put_tps > 10000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High TPS for topic {{ $labels.topic }}"
          description: "Topic {{ $labels.topic }} has {{ $value }} TPS"

      - alert: RocketMQClusterBrokerCountDrop
        expr: delta(rocketmq_cluster_broker_count[10m]) < 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Broker count dropped in cluster {{ $labels.cluster }}"
          description: "Broker count decreased in cluster {{ $labels.cluster }}"
